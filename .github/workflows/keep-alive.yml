name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 */3 * *"   # har 3 din, subah 6 UTC
  workflow_dispatch:         # haath se bhi chala sakte ho

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" \
              -X POST "$URL/rest/v1/rpc/ping" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" -d '{}')
            echo "Try $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          exit 1
